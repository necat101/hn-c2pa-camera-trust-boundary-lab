name: audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: evaluate fixtures
        run: python3 scripts/evaluate_cases.py
      - name: run tests
        run: |
          python3 -m unittest tests.test_evaluate_cases -v
          python3 tests/test_evaluate_cases.py
